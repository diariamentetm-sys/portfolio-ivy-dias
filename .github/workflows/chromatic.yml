name: Chromatic

# Só roda quando o design system Cashlog (ou a infra do Storybook) muda.
# Push/PR só de conteúdo do portfólio não disparam Chromatic.
on:
  push:
    branches: [main]
    paths:
      - "src/embeds/cashlog/**"
      - ".storybook/**"
      - "vite.cashlog.config.ts"
      - "tailwind.cashlog.config.js"
      - "postcss.cashlog.config.js"
      - ".github/workflows/chromatic.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "src/embeds/cashlog/**"
      - ".storybook/**"
      - "vite.cashlog.config.ts"
      - "tailwind.cashlog.config.js"
      - "postcss.cashlog.config.js"
      - ".github/workflows/chromatic.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
